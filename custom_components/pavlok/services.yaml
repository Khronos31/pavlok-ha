stimulate:
  name: Stimulate
  description: Fire a Pavlok vibration, beep, or explicitly enabled zap.
  fields:
    entry_id:
      selector:
        config_entry:
          integration: pavlok
    type:
      required: true
      selector:
        select:
          options: [vibe, beep, zap]
    intensity:
      required: true
      selector:
        number:
          min: 0
          max: 100
    count:
      required: true
      selector:
        number:
          min: 1
          max: 127
set_alarm:
  name: Set alarm
  description: Add an alarm after reading and preserving the device alarm list.
  fields:
    time:
      required: true
      selector:
        time:
    days:
      selector:
        select:
          multiple: true
          options: [sun, mon, tue, wed, thu, fri, sat]
    name:
      selector:
        text:
    enabled:
      selector:
        boolean:
    vibe:
      selector:
        boolean:
    vibe_intensity:
      selector:
        number:
          min: 0
          max: 100
    vibe_count:
      selector:
        number:
          min: 1
          max: 127
    beep:
      selector:
        boolean:
    beep_intensity:
      selector:
        number:
          min: 0
          max: 100
    beep_count:
      selector:
        number:
          min: 1
          max: 127
    zap:
      selector:
        boolean:
    zap_intensity:
      selector:
        number:
          min: 0
          max: 100
    zap_count:
      selector:
        number:
          min: 1
          max: 127
    unlock:
      description: How the alarm has to be dismissed.
      selector:
        select:
          options: [none, jacks, qr, puzzle]
    jacks:
      description: Number of jumping jacks, used when unlock is "jacks".
      selector:
        number:
          min: 1
          max: 255
    interval:
      description: Seconds between repeats until the alarm is dismissed.
      selector:
        number:
          min: 1
          max: 65535
          unit_of_measurement: s
    snooze:
      description: Allow snoozing.
      selector:
        boolean:
    snooze_zap:
      description: Zap on snooze.
      selector:
        boolean:
    light_sleep:
      description: Wake during light sleep near the set time.
      selector:
        boolean:
delete_alarm:
  name: Delete alarm
  description: Remove one alarm and write the remaining device alarm list.
  fields:
    id:
      required: true
      selector:
        text:
timer:
  name: Timer
  description: >-
    Save, start, pause, resume or reset the device-side timer or stopwatch.
    Saving and starting are separate on the device: "save" stores the settings
    without running them, and "start" without a duration runs whatever is stored.
  fields:
    action:
      required: true
      selector:
        select:
          options: [start, save, pause, resume, reset]
    type:
      selector:
        select:
          options: [timer, stopwatch]
    seconds:
      description: >-
        Countdown length; a stopwatch uses 0. Required for "save". Omit it with
        "start" to run the settings already stored on the device.
      selector:
        number:
          min: 0
          max: 86399
          unit_of_measurement: s
    stimulus:
      selector:
        select:
          options: [vibe, beep, zap]
    interval:
      description: Seconds between stimuli.
      selector:
        number:
          min: 0
          max: 255
          unit_of_measurement: s
    interval_mode:
      description: >-
        "once" fires a single stimulus. "repeat" fires one every interval and
        keeps going until the timer is reset.
      selector:
        select:
          options: [once, repeat]
sync_history:
  name: Sync history
  description: Read sleep history and add duration records to Home Assistant statistics.
